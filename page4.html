      <!-- Main Content -->

        <h1>My Fourth Heading</h1>

        <ul id="album">
          <!--<li id="photo"><img src="images/winterland1.jpg" /></li>
          <li id="photo"><img src="images/winterland2.jpg" /></li>
          <li id="photo"><img src="images/winterland3.jpg" /></li>

      <!-- End Main Content -->

      <!-- Footer Information -->
      <footer>&copy; Copyright 2024</footer>
      <script>
        var photos = []; // Declare an empty array to store image elements
        var fileNames = []; // Declare an empty array to store image file names
        var imageList = []; // Declare an empty array to store HTML list that contains an image
        var image; // Declare an empty variable to store the assembled image list codes
        var openList = "<li id='photo'>"; // Declare a variable to contain the open list tag
        var closeList = "</li>"; // Declare a variable to contain the close list tag

        for (var i = 0; i < 6; i++) {
          fileNames.push("winterland" + (i + 1));
          photos.push("<img src='images/" + fileNames[i] + ".jpg'>");
          image = openList + photos[i] + closeList;
          imageList.push(image);
        }
        document.getElementById("album").innerHTML = imageList.join("");
      </script>
